<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1626">
<title>Beam</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><img src="/icon.svg" alt="" width="26" height="26"><span>Beam</span></div>
  <button id="settingsBtn" class="account" aria-label="Settings" hidden></button>
</header>

<main>
  <section class="stage">
    <div id="peers" class="peers"></div>
    <p id="empty" class="empty"></p>
    <div class="you">
      <span class="you-dot" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <div id="me" class="you-text"></div>
    </div>
  </section>
  <section id="transfers" class="transfers" aria-label="Transfers"></section>
</main>

<input id="filePick" type="file" multiple hidden>

<div id="sheet" class="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true">
    <div id="sheetBody"></div>
  </div>
</div>

<div id="auth" class="auth" hidden>
  <div class="auth-card" id="authBody"></div>
</div>

<script src="/app.js"></script>
</body>
</html>
