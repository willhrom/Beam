<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Beam</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><img src="/icon.svg" alt="" width="28" height="28"><span>Beam</span></div>
  <button id="settingsBtn" class="icon-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7zm7.43-2.53c.04-.32.07-.64.07-.97s-.03-.66-.07-1l2.11-1.63a.5.5 0 0 0 .12-.64l-2-3.46a.5.5 0 0 0-.61-.22l-2.49 1a7.3 7.3 0 0 0-1.69-.98l-.38-2.65A.49.49 0 0 0 14 2h-4a.49.49 0 0 0-.49.42l-.38 2.65c-.61.25-1.17.58-1.69.98l-2.49-1a.5.5 0 0 0-.61.22l-2 3.46a.49.49 0 0 0 .12.64L4.57 11c-.04.34-.07.67-.07 1s.03.65.07.97l-2.11 1.66a.49.49 0 0 0-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.58 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46a.5.5 0 0 0-.12-.64l-2.11-1.66z"/></svg>
  </button>
</header>

<main>
  <section class="radar">
    <div class="rings"><i></i><i></i><i></i></div>
    <div id="peers" class="peers"></div>
    <p id="empty" class="empty">Looking for devices…<br><small>Open Beam on another device on this WiFi, or pair one in Settings.</small></p>
  </section>
  <p id="me" class="me"></p>
  <section id="transfers" class="transfers"></section>
</main>

<input id="filePick" type="file" multiple hidden>

<div id="sheet" class="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true">
    <div id="sheetBody"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
