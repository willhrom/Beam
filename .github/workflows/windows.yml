name: Build Windows app

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # The signed identity package that puts Beam in the Windows Share window.
      - name: Build the Share menu package
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          if (-not $env:PFX_B64) { Write-Host "::warning::No WINDOWS_SIGN_PFX_B64 secret, so this build can't add Beam to the Share window."; exit 0 }
          $kit = Get-Item "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64" | Where-Object { Test-Path (Join-Path $_.FullName "makeappx.exe") } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $kit) { Write-Host "::error::Couldn't find the Windows SDK tools"; exit 1 }
          Write-Host "Using $($kit.FullName)"
          $pfx = Join-Path $env:RUNNER_TEMP "share.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          New-Item -ItemType Directory -Force windows\identity-out | Out-Null
          & "$($kit.FullName)\makeappx.exe" pack /d windows\identity /p windows\identity-out\Beam.Share.msix /nv /o
          if ($LASTEXITCODE) { exit 1 }
          & "$($kit.FullName)\signtool.exe" sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 windows\identity-out\Beam.Share.msix
          if ($LASTEXITCODE) { exit 1 }
          Remove-Item $pfx
          # Check Windows accepts it: trust the certificate on this build machine and register the package.
          Import-Certificate -FilePath windows\identity\beam-share.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\beam-ext" | Out-Null
          Add-AppxPackage -Path windows\identity-out\Beam.Share.msix -ExternalLocation "$env:RUNNER_TEMP\beam-ext"
          Get-AppxPackage Beam.Share | Format-List Name, Version, Status, SignatureKind
          Get-AppxPackage Beam.Share | Remove-AppxPackage
      - name: Build
        shell: bash
        env:
          BEAM_URL: ${{ vars.BEAM_URL }}
        run: |
          URL="${BEAM_URL:-https://beam.wahromyk.workers.dev}"
          sed -i -e "s#__BEAM_URL__#$URL#" -e "s#__REPO__#${{ github.repository }}#" windows/Program.cs
          dotnet publish windows/Beam.csproj -c Release -p:Version=1.0.${{ github.run_number }} -o out
          cp out/Beam.exe Beam.exe
          SHA=$(sha256sum Beam.exe | cut -d' ' -f1)
          echo "{\"version\": ${{ github.run_number }}, \"url\": \"https://github.com/${{ github.repository }}/releases/download/windows/Beam.exe\", \"sha256\": \"$SHA\"}" > windows.json
          cat windows.json
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows
          name: Beam for Windows (always the newest)
          body: |
            Download Beam.exe and run it. It lives in the system tray and starts with Windows.
            Windows SmartScreen may warn because the app isn't signed: click "More info" → "Run anyway".
          files: |
            Beam.exe
            windows.json
          overwrite_files: true
          make_latest: false
