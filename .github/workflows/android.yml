name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's build machines come with the Android SDK already installed
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Load the signing key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repository secrets first."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - name: Build the app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          BEAM_URL: ${{ vars.BEAM_URL }}
        run: gradle -p android assembleRelease --no-daemon
      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
      - name: Name the file and write the update manifest
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk beam.apk
          SHA=$(sha256sum beam.apk | cut -d' ' -f1)
          echo "{\"version\": ${{ github.run_number }}, \"url\": \"https://github.com/${{ github.repository }}/releases/download/android/beam.apk\", \"sha256\": \"$SHA\"}" > android.json
          cat android.json
      # Always published to the same "android" release, so the download link never changes.
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Beam for Android (always the newest)
          body: "Install on your phone by opening: https://github.com/${{ github.repository }}/releases/download/android/beam.apk"
          files: |
            beam.apk
            android.json
          overwrite_files: true
          make_latest: false
